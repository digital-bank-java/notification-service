name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    uses: digital-bank-java/.github/.github/workflows/java-maven-verify.yml@61a2df2309661a19d15f1428b79fd6fafc2bb01f
    permissions:
      contents: read

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0
      - name: Lint chart
        run: helm lint helm --strict --values helm/values-sit.yaml
      - name: Render chart
        run: |
          helm template notification-service helm \
            --namespace digital-bank-sit \
            --values helm/values-sit.yaml \
            --set image.tag="${GITHUB_SHA}" > rendered.yaml
          test -s rendered.yaml
          grep -A1 -E '^            - name: SERVER_PORT$' rendered.yaml | grep -q 'value: "8088"'

  container:
    name: Container build and smoke test
    needs:
      - verify
      - helm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notification_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: digital-bank-java/notification-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        shell: bash
        run: |
          cleanup() {
            docker rm --force notification-service-ci > /dev/null 2>&1 || true
            if [[ -n "${mock_server_pid:-}" ]]; then
              kill "${mock_server_pid}" > /dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Config.User}}' digital-bank-java/notification-service:ci)" = "10001:10001"

          python3 - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          body = json.dumps({
              "name": "notification-service",
              "profiles": ["sit"],
              "label": None,
              "version": "ci",
              "state": None,
              "propertySources": [{"name": "ci", "source": {"server.port": 9099}}],
          }).encode()

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path not in ("/notification-service/sit", "/notification-service/default"):
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  pass

          HTTPServer(("127.0.0.1", 8888), Handler).serve_forever()
          PY
          mock_server_pid=$!

          for attempt in {1..10}; do
            curl --fail --silent http://127.0.0.1:8888/notification-service/sit > /dev/null && break
            sleep 1
          done

          docker run --detach \
            --name notification-service-ci \
            --network host \
            --env CONFIG_SERVER_URL=http://127.0.0.1:8888 \
            --env SPRING_PROFILES_ACTIVE=sit \
            --env SERVER_PORT=8088 \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/notification_service \
            --env SPRING_DATASOURCE_USERNAME=postgres \
            --env SPRING_DATASOURCE_PASSWORD=postgres \
            digital-bank-java/notification-service:ci

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8088/actuator/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "${ready}" != "true" ]]; then
            docker logs notification-service-ci
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8088/v3/api-docs > /dev/null
