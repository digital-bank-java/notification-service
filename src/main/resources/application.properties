spring.application.name=notification-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${digital-bank.service.runtime-profile:${spring.profiles.active:default}}
logging.structured.json.rename.service=ecs_service
logging.structured.json.rename.correlation_id=ecs_correlation_id
logging.structured.json.rename.traceId=ecs_trace_id
logging.structured.json.rename.spanId=ecs_span_id
logging.structured.json.rename.flat_service=service
logging.structured.json.rename.flat_correlation_id=correlation_id
logging.structured.json.rename.flat_trace_id=trace_id
logging.structured.json.rename.flat_span_id=span_id
logging.structured.json.customizer=com.digitalbank.notificationservice.FlatStructuredLoggingJsonMembersCustomizer

management.tracing.export.zipkin.enabled=${ZIPKIN_TRACING_ENABLED:false}

server.port=8088

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka consumption is opt-in until the governed transfer-created contract is deployed in SIT.
notification.events.transfer-created.enabled=${NOTIFICATION_TRANSFER_EVENTS_ENABLED:false}
notification.events.transfer-created.topic=${NOTIFICATION_TRANSFER_EVENTS_TOPIC:events.transfer.created.v1}
notification.events.allowed-producers=${NOTIFICATION_EVENTS_ALLOWED_PRODUCERS:transaction-service}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
