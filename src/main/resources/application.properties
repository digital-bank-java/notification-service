spring.application.name=notification-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8088

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka consumption is opt-in until the governed transfer-created contract is deployed in SIT.
notification.events.transfer-created.enabled=${NOTIFICATION_TRANSFER_EVENTS_ENABLED:false}
notification.events.transfer-created.topic=${NOTIFICATION_TRANSFER_EVENTS_TOPIC:events.transfer.created.v1}
notification.events.allowed-producers=${NOTIFICATION_EVENTS_ALLOWED_PRODUCERS:transaction-service}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
